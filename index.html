<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reporte operativo de contact center — Demo visual (datos ficticios)</title>
<style>
:root{
  --font:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --app:#F1F4F8;--card:#FFFFFF;--border:#E2E6EC;--text:#1F2937;--muted:#6B7280;
  --accent:#2F5FDB;--accent-h:#1E3FA0;--accent-p:#172F7A;--thead:#F8FAFC;--sub:#EEF2FF;
  --btn:#DCDAD5;--btn-h:#EEEBE7;--btn-b:#B8B5AE;--field:#FFFFFF;--tb:#000000;
  --neu-bg:#F3F4F6;--neu-fg:#6B7280;--cell:#FFFFFF;
}
[data-theme="dark"]{
  --app:#0F172A;--card:#1E293B;--border:#334155;--text:#F1F5F9;--muted:#CBD5E1;
  --accent:#2563EB;--accent-h:#3B82F6;--accent-p:#1D4ED8;--thead:#273449;--sub:#334155;
  --btn:#475569;--btn-h:#64748B;--btn-b:#64748B;--field:#0F172A;--tb:#0B1220;
  --neu-bg:#2B3648;--neu-fg:#CBD5E1;--cell:#2B3648;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:12px/1.4 var(--font);background:var(--app);color:var(--text);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
.muted{color:var(--muted)}.small{font-size:11px}.tiny{font-size:10px}.b{font-weight:700}
#strip{height:28px;display:flex;align-items:center;justify-content:center;background:linear-gradient(90deg,#2F5FDB,#0C9A82);color:#fff;font-weight:600;font-size:12px;padding:0 10px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#app{display:grid;grid-template-columns:230px minmax(0,1fr);height:calc(100vh - 28px)}
#side{background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:10px 12px 8px;gap:6px;min-height:0;overflow:hidden}
.emb{width:56px;height:56px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px;font-weight:700;flex:none}
.wm{text-align:center;line-height:1.15;flex:none}
.wm .w{font-size:19px;font-weight:800;letter-spacing:3px;color:var(--accent)}
.wm .s{font-size:11px;font-weight:700;letter-spacing:.6px;color:var(--muted)}
.cap{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;margin:4px 0 2px}
select,input[type=text],input[type=password],input[type=number]{background:var(--field);border:1px solid var(--border);padding:4px 6px;border-radius:2px;min-width:0}
select.sm{padding:2px 4px;font-size:11px}
#side select{width:100%;font-weight:700;font-size:13px}
.nav{display:flex;align-items:center;gap:8px;padding:5px 8px;cursor:pointer;font-size:13px;border-radius:3px;user-select:none}
.nav:hover{background:var(--sub)}
.nav .ic{width:20px;text-align:center;font-size:14px}.nav .ic:empty{display:none}
.nav.on{background:var(--accent);color:#fff;font-weight:700}
.nav.on .ic{filter:brightness(0) invert(1)}
.btn{background:var(--btn);border:1px solid var(--btn-b);padding:4px 10px;cursor:pointer;border-radius:2px;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--btn-h)}
.btn.act{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn.act:hover:not(:disabled){background:var(--accent-h)}
.btn.act:active:not(:disabled){background:var(--accent-p)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.full{width:100%}.btn.sm{padding:2px 7px;font-size:11px}
#logbox{flex:1;min-height:80px;display:flex;flex-direction:column;border:1px solid var(--border)}
#logbox .hd{background:var(--accent);color:#fff;display:flex;align-items:center;gap:6px;padding:3px 6px;font-weight:700;font-size:11px}
#logbox .hd .sp{flex:1}
#logbox .hd button{background:rgba(255,255,255,.2);border:0;color:#fff;font-size:10px;padding:1px 6px;cursor:pointer;border-radius:2px}
#log{background:#0A1A3A;color:#A8C8FF;font:10.5px/1.45 Consolas,"Courier New",monospace;flex:1;overflow:auto;padding:5px 6px}
#log .t{color:#5A8AAA}#log .step{color:#5BC8F5}#log .success{color:#4EC98A}#log .warning{color:#FFC220}#log .error{color:#FF6B6B;font-weight:700}
.foot{font-size:10px;font-weight:700;color:var(--muted);text-align:center;line-height:1.3;flex:none}
#main{display:flex;flex-direction:column;min-width:0;min-height:0}
#top{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:6px 16px;flex-wrap:wrap;flex:none}
#top .ver{font-weight:700;color:var(--muted);font-size:12px}
#top .st{font-size:11px;color:var(--muted)}
#top .st.new{color:var(--accent);text-decoration:underline;cursor:pointer}
.mode{border:0;color:#fff;font-weight:700;padding:5px 12px;cursor:default;border-radius:2px}
.mode.red{background:#16A34A;cursor:pointer}.mode.loc{background:#F97316;cursor:pointer}.mode.demo{background:#6B7280}
#burger{display:none}
#view{flex:1;overflow:auto;padding:0 16px 16px;min-height:0}
#bar{flex:none;padding:3px 16px;border-top:1px solid var(--border);background:var(--card);font-size:11px;color:var(--muted);min-height:22px}
.card{background:var(--card);border:1px solid var(--border);padding:12px;margin-bottom:12px}
.chd{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.ct{font-size:15px;font-weight:700}
.cb{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
h1.pt{font-size:21px;margin:0 0 2px}
.hdr{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
.chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.chip{display:flex;flex-direction:column;gap:1px;max-width:260px}
.chip .lbl{font-size:10px;color:var(--muted)}
.pill{padding:2px 8px;font-weight:700;font-size:11px;border-radius:2px;line-height:1.3}
.pill.ok{background:#DCFCE7;color:#166534}.pill.bad{background:#FEE2E2;color:#991B1B}.pill.neu{background:var(--neu-bg);color:var(--neu-fg)}
.dayrow{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px}
.note{font-size:11px;color:var(--muted);margin:4px 0}
.kpis{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--border);padding:8px;display:flex;gap:8px;align-items:center;min-width:0}
.kpi .ci{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex:none}
.kpi .kl{font-size:10px;color:var(--muted)}.kpi .kv{font-size:19px;font-weight:700;line-height:1.1}
.krow{display:flex;gap:8px;align-items:stretch;margin-bottom:12px}.krow .kpis{flex:1;margin:0}
.bctl{display:flex;gap:4px;align-items:center;justify-content:flex-end;margin-bottom:3px}
.tw{overflow:auto;max-width:100%}
table.heat{border-collapse:collapse;font-size:11px}
table.heat th,table.heat td{border:1px solid var(--tb);padding:2px 6px;text-align:center;white-space:nowrap;background:var(--cell)}
table.heat th{background:var(--thead);font-weight:700}
table.heat td.l,table.heat th.l{text-align:left}
table.heat tr.tot td{font-weight:700;background:var(--sub)}
table.heat td.sub{font-weight:700;background:var(--sub);text-align:left}
table.heat td.em{color:var(--muted);font-style:italic}
table.heat td.sel{outline:2px solid var(--accent);outline-offset:-2px}
table.heat tr.rsel td{background:#DBE7FF;color:#111}
table.heat tr.clk{cursor:pointer}
.rkrow{display:flex;gap:12px;overflow:auto;padding-bottom:6px;align-items:flex-start}
.rk{min-width:210px;flex:none}.rkt{font-weight:700;font-size:11px;padding:3px 6px;background:var(--thead);border:1px solid var(--tb);border-bottom:0;text-align:center}
.ph{padding:50px 20px;text-align:center;color:var(--muted);font-size:15px}
.tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--border);margin-bottom:10px}
.tabs button{padding:7px 14px;border:1px solid var(--border);border-bottom:0;background:var(--btn);cursor:pointer;margin-bottom:-1px}
.tabs button.on{background:var(--card);font-weight:700;border-bottom:1px solid var(--card)}
.grid2{display:grid;grid-template-columns:5fr 2fr;gap:12px}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid23{display:grid;grid-template-columns:2fr 3fr;gap:12px}
.ck{display:inline-flex;align-items:center;gap:5px;margin:2px 14px 2px 0;font-size:12px;cursor:pointer}
.ckgrid{display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));gap:2px 10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.sec{font-weight:700;font-size:13px;margin:10px 0 4px}
.frm{display:grid;grid-template-columns:200px minmax(0,420px);gap:8px 10px;align-items:center}
.frm input[type=text],.frm input[type=password]{width:100%}
.tree{font-size:12px}.tree .gr{font-weight:700;margin-top:6px}.tree .it{padding:2px 6px 2px 16px;cursor:pointer}.tree .it:hover{background:var(--sub)}.tree .it.on{background:var(--accent);color:#fff}
.det h2{margin:2px 0 4px;font-size:20px}.det h4{margin:12px 0 2px;font-size:12px;color:var(--accent)}
.cl{border:2px solid var(--border);margin-bottom:12px}.cl .cht{color:#fff;font-weight:700;padding:5px 10px;font-size:13px}.cl .cli{display:flex;gap:10px;align-items:flex-start;padding:5px 10px;border-top:1px solid var(--border)}
.bdg{color:#fff;font-weight:700;font-size:10px;padding:1px 6px;min-width:84px;text-align:center;flex:none}
.hl{background:#fff176!important;color:#000!important}
.tile{display:inline-flex;flex-direction:column;border:1px solid var(--border);padding:4px 12px;margin-right:6px;font-weight:700;min-width:120px}
.tile span{font-size:10px;font-weight:400;color:var(--muted)}
.cardrow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-bottom:8px}
.sc{border:1px solid var(--border);padding:6px 8px;background:var(--card)}.sc .l{font-size:10px;color:var(--muted)}.sc .v{font-size:17px;font-weight:700}
.sc.r{background:#FEE2E2;color:#991B1B}.sc.d{background:#1E3A8A;color:#fff}.sc.d .l{color:#DBEAFE}
#toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:#111827;color:#fff;padding:8px 16px;border-radius:4px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:80vw;text-align:center}
#toast.on{opacity:.96}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:40}
#modal.on{display:flex}
#modal .box{background:var(--card);border:1px solid var(--border);padding:16px;min-width:300px;max-width:min(560px,92vw);max-height:86vh;overflow:auto}
#modal h3{margin:0 0 8px;font-size:15px}
.cal{display:grid;grid-template-columns:repeat(7,36px);gap:2px;margin:8px 0}
.cal button{height:30px;border:1px solid var(--border);background:var(--card);cursor:pointer}
.cal button:disabled{opacity:.35;cursor:not-allowed}.cal button.on{background:var(--accent);color:#fff}
.cal .h{text-align:center;font-weight:700;font-size:10px;color:var(--muted);line-height:30px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}.grid2,.grid23,.cols2{grid-template-columns:1fr}.cardrow{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:900px){
  #app{grid-template-columns:minmax(0,1fr)}
  #side{position:fixed;left:0;top:28px;bottom:0;width:250px;z-index:30;transform:translateX(-100%);transition:transform .2s}
  #side.open{transform:none}#burger{display:inline-block}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.frm{grid-template-columns:1fr}
}
@media (max-height:760px){.emb,.foot{display:none}}

</style>
</head>
<body>
<div id="strip">Demo visual con datos ficticios — ningún número, nombre o identificador de esta página corresponde a un cliente, campaña o sistema real.</div>
<div id="app">
  <aside id="side">
    <div class="emb" id="emb"></div>
    <div class="wm"><div class="w" id="wmw"></div><div class="s" id="wms"></div></div>
    <div><div class="cap">Campaña</div><select id="camp" aria-label="Campaña"></select></div>
    <nav id="nav"></nav>
    <div style="height:1px;background:var(--border);margin:2px 0"></div>
    <button class="btn act full" id="bupd" data-act="upd">Actualizar datos</button>
    <button class="btn full" id="bmail" data-act="mail" disabled>Enviar mail</button>
    <div id="logbox">
      <div class="hd"><span>Registro</span><span class="sp"></span><button data-act="logclr">Limpiar</button><button data-act="logcp">Copiar</button></div>
      <div id="log"></div>
    </div>
    <div class="foot">Demo visual<br>con datos ficticios</div>
  </aside>
  <div id="main">
    <div id="top">
      <button class="btn" id="burger" data-act="burger" aria-label="Menú">Menú</button>
      <span style="flex:1"></span>
      <span class="ver" id="ver"></span>
      <button class="btn" data-act="chk">Buscar actualizaciones</button>
      <span class="st" id="updst"></span>
      <button class="mode demo" id="modebtn" data-act="mode">MODO DEMO</button>
      <button class="btn" id="thbtn" data-act="theme">Tema oscuro</button>
    </div>
    <main id="view"></main>
    <div id="bar"></div>
  </div>
</div>
<div id="toast" role="status"></div>
<div id="modal"><div class="box" id="mbox"></div></div>

<script>
(function () {
"use strict";

/* ===================== Utilidades ===================== */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = (n) => String(n).padStart(2, "0");
const num = (v, d) => (v == null || !isFinite(v)) ? "—" : Number(v).toFixed(d || 0).replace(".", ",");
const pc = (v, d) => (v == null || !isFinite(v)) ? "—" : num(v * 100, d || 0) + "%";
const mmss = (s) => { if (s == null || !isFinite(s)) return "—"; s = Math.round(s); return Math.floor(s / 60) + ":" + pad(s % 60); };
const hmmss = (s) => { s = Math.round(s); return Math.floor(s / 3600) + ":" + pad(Math.floor((s % 3600) / 60)) + ":" + pad(s % 60); };
function mulberry32(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function hs(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
const hex = (c) => [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16));
const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
const rgb = (a) => "rgb(" + a.join(",") + ")";
function pctile(arr, p) { if (!arr.length) return null; const s = arr.slice().sort((x, y) => x - y); const k = (s.length - 1) * p; const f = Math.floor(k), c = Math.ceil(k); return s[f] + (s[c] - s[f]) * (k - f); }
function scale3(v, min, med, max, c0, c1, c2) { const A = hex(c0), B = hex(c1), C = hex(c2); if (max <= min) return rgb(B); if (v <= med) return rgb(mix(A, B, (v - min) / ((med - min) || 1))); return rgb(mix(B, C, (v - med) / ((max - med) || 1))); }
const SK = {
  good: "background:#DCFCE7;color:#166534", warn: "background:#FEF3C7;color:#92400E",
  bad: "background:#FEE2E2;color:#991B1B", neu: "background:var(--neu-bg);color:var(--neu-fg)",
  info: "background:#8EAADB;color:#44546A"
};
const DOW = ["dom", "lun", "mar", "mié", "jue", "vie", "sáb"];
const DOWL = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];
const MES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
const fdate = (d) => pad(d.getDate()) + "/" + pad(d.getMonth() + 1) + "/" + d.getFullYear();
const fdateL = (d) => DOWL[d.getDay()] + " " + d.getDate() + " de " + MES[d.getMonth()] + " de " + d.getFullYear();
function isoWeek(d) { const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const n = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - n); const y = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.ceil(((t - y) / 864e5 + 1) / 7); }
const toMin = (s) => { const m = /^(\d{1,2}):(\d{2})$/.exec(String(s).trim()); if (!m) return NaN; const h = +m[1], mi = +m[2]; return (mi > 59 || h > 24 || (h === 24 && mi > 0)) ? NaN : h * 60 + mi; };
const NB = "     ";

/* ===================== Definiciones estáticas ===================== */
const VER = "v1.0-demo";
const CAMPS = {
  A: { kind: "nube", hue: 215, segs: { "Ventas": ["Cola_Ventas", "Cola_Cotizaciones", "Cola_Planes"], "Soporte": ["Cola_Soporte", "Cola_Tecnico", "Cola_Reclamos"] }, extra: ["Cola_Interna"], over: "xls", rosterOk: true },
  B: { kind: "nube", hue: 160, segs: { "Retención": ["Cola_Retencion", "Cola_Bajas", "Cola_Ofertas"], "Soporte": ["Cola_Consultas", "Cola_Reclamos", "Cola_Facturacion"] }, extra: ["Cola_Pruebas"], over: "db", rosterOk: true },
  C: { kind: "nube", hue: 28, segs: { "General": ["Cola_General", "Cola_Consultas", "Cola_Reclamos", "Cola_Tramites"] }, extra: ["Cola_Interna"], over: "both", rosterOk: true, cards: true },
  D: { kind: "nube", hue: 280, segs: { "General": ["Cola_Mesa", "Cola_Ayuda", "Cola_Seguimiento", "Cola_Asesoria", "Cola_VIP"] }, extra: [], over: "xls", rosterOk: false },
  E: { kind: "nube", hue: 340, segs: { "LOB 1": ["Cola_Pedidos", "Cola_Cambios", "Cola_Envios"], "LOB 2": ["Cola_Pagos", "Cola_Cuentas", "Cola_Fraude"], "LOB 3": ["Cola_Seguros", "Cola_Siniestros", "Cola_Polizas"] }, extra: [], over: "xls", rosterOk: true, excl: "E", single: true },
  F: { kind: "nube", hue: 190, segs: { "Entrada": ["Cola_Entrada_1", "Cola_Entrada_2", "Cola_Entrada_3"], "Salida": ["Cola_Salida_1", "Cola_Salida_2"] }, extra: [], over: "xls", rosterOk: true, excl: "F", dual: true },
  G: { kind: "onp", hue: 45, segs: { "Soporte": ["Skill_101", "Skill_102", "Skill_103"], "Cobranza": ["Skill_201", "Skill_202"] }, extra: ["Skill_999"], over: "db", rosterOk: true },
  H: { kind: "onp", hue: 95, segs: { "Atención": ["Skill_301", "Skill_302"], "Ventas": ["Skill_311", "Skill_312"], "Retención": ["Skill_321"], "Cobranza": ["Skill_331", "Skill_332"], "Soporte N1": ["Skill_341"], "Soporte N2": ["Skill_351"], "Reclamos": ["Skill_361"], "Backoffice": ["Skill_371"], "Saliente": ["Skill_381"] }, extra: [], over: "db", rosterOk: true }
};
const AUX_NUBE = ["Break", "Ocupado", "Capacitación", "Disponible", "Ausente", "Comida", "Reunión", "Sistema Ausente", "Fuera de cola"];
const AUX_ONP = ["No Usar", "Baño", "Calidad", "Formación", "Break", "Call Back", "Coaching Supervisor", "Backoffice", "Lunch", "Otros"];
const COLS = [["frc", "FRC"], ["ofr", "OFR"], ["atn", "ATN"], ["abn", "ABN"], ["var", "%VAR"], ["o2f", "%O2F"], ["h2f", "%H2F"], ["sl", "%SL"], ["na", "%NA"], ["asa", "ASA"], ["aht", "AHT"], ["avail", "%Avail"], ["sched", "Sched"], ["req", "Req"], ["pres", "Pres"], ["prod", "Prod"], ["aus", "%AUS"], ["aux", "%AUX"]];
const MOTIVOS = ["Consulta de estado", "Reclamo por cobro", "Cambio de datos", "Solicitud de baja", "Consulta de saldo", "Problema de acceso", "Información de producto", "Seguimiento de caso", "Felicitaciones", "Cotización", "Garantía", "Devolución", "Facturación", "Soporte técnico", "Reprogramación", "Activación", "Cambio de plan", "Falla del servicio", "Consulta de horario", "Mejora de cuenta", "Cierre de caso", "Duplicado de documento", "Otros motivos", "Sin motivo"];

const SLOTS = [];
for (let m = 450; m <= 1230; m += 30) SLOTS.push({ m: m, l: pad(Math.floor(m / 60)) + ":" + pad(m % 60) });
const shape = (m) => { const x = m / 60; return 0.22 + 0.78 * Math.exp(-Math.pow(x - 11.5, 2) / (2 * 2.3 * 2.3)) + 0.68 * Math.exp(-Math.pow(x - 16.5, 2) / (2 * 1.9 * 1.9)); };

function genData(id, seed, dayOff) {

  const segNames = Object.keys(C.segs);

  const work = {}; segNames.forEach((n) => { work[n] = SLOTS.map(() => 0); });
  const allQ = [];
  segNames.forEach((n) => C.segs[n].forEach((q) => allQ.push({ q: q, seg: n, extra: false })));
  C.extra.forEach((q) => allQ.push({ q: q, seg: null, extra: true }));
  allQ.forEach((o) => {
    const base = o.extra ? rr(2, 5) : rr(14, 46);
    d.q[o.q] = SLOTS.map((s, i) => {
      const ofr = Math.max(0, Math.round(base * shape(s.m) * rr(0.82, 1.18)));
      if (!ofr) return { ofr: 0, atn: 0, abnR: 0, abnF: 0, slg: 0, aht: 0, hold: 0, ring: 0, out: 0, asa: 0 };
      const abnR = Math.min(ofr, Math.round(ofr * rr(0.01, 0.12))), abnF = Math.round(abnR * rr(0, 0.25));
      const atn = ofr - abnR, aht = Math.round(atn * rr(250, 570));
      if (o.seg) work[o.seg][i] += aht;
      return { ofr: ofr, atn: atn, abnR: abnR, abnF: abnF, slg: Math.round(atn * rr(0.70, 0.98)), aht: aht, hold: Math.round(aht * 0.1), ring: Math.round(atn * rr(0, 3)), out: onp ? Math.round(atn * rr(0, 0.12)) : 0, asa: rr(2, 38) };
    });
  });
  const cats = onp ? AUX_ONP : AUX_NUBE;
  const mkAux = (t) => { const w = cats.map(() => 0.2 + R()), s = w.reduce((a, b) => a + b, 0), a = {}; cats.forEach((c, k) => { a[c] = t * w[k] / s; }); return a; };
  segNames.forEach((n) => {
    d.lobs[lobOf(n)] = SLOTS.map((s, i) => {
      const W = work[n][i]; if (W <= 0) return { conn: 0, idle: 0, aux: {} };
      const auxT = (W / rr(0.62, 0.84)) * rr(0.10, 0.28);
      const idle = Math.max((W / rr(0.62, 0.84)) - W - auxT, W * 0.08);
      return { conn: W + auxT + idle, idle: idle, aux: mkAux(auxT) };
    });
    d.over[lobOf(n)] = SLOTS.map((s, i) => {
      const frc = Math.round(work[n][i] / 410 * rr(0.88, 1.15));
      const req = Math.ceil(frc * 420 / 1800 / 0.82);
      return { frc: frc, req: req, sched: Math.max(1, Math.round(work[n][i] / 1800 / 0.72 * rr(1.02, 1.3))) };
    });
  });
  d.lobs["LOB Apoyo"] = SLOTS.map(() => { const c = rr(1800, 5400); return { conn: c, idle: c * 0.5, aux: mkAux(c * 0.5) }; });
  d.over["LOB Apoyo"] = SLOTS.map(() => ({ frc: 0, req: 0, sched: 1 }));
  const nAg = onp && segNames.length > 5 ? 30 : 20;
  for (let i = 0; i < nAg; i++) {
    d.agents.push({ name: "Agente " + pad(i + 1), sup: "Supervisor " + (1 + (i % 5)), seg: segNames[i % segNames.length], atn: Math.round(rr(28, 112)), aht: rr(250, 610), hold: rr(4, 60), ring: rr(0, 12), tab: Math.round(rr(0, 14)), bano: Math.round(rr(60, 2700)), brk: Math.round(rr(300, 2400)) });
  }

  TIP.forEach((g) => g[1].forEach((k) => { d.tip[g[0] + "|" + k] = SLOTS.map((s) => Math.round(shape(s.m) * rr(0, 8))); }));
  return d;
}

const RAW = ["ofr", "atn", "abnR", "abnF", "slg", "aht", "hold", "ring", "out", "asaS", "asaN", "conn", "idle", "frc", "req", "sched"];

function addQ(r, c) { if (!c) return; r.ofr += c.ofr; r.atn += c.atn; r.abnR += c.abnR; r.abnF += c.abnF; r.slg += c.slg; r.aht += c.aht; r.hold += c.hold; r.ring += c.ring; r.out += c.out; if (c.ofr > 0) { r.asaS += c.asa; r.asaN++; } }

function derive(r, onp, n) {
  n = n || 1;

  r.na = r.ofr > 0 ? r.atn / r.ofr : null;
  r.abnp = r.ofr > 0 ? r.abn / r.ofr : null;
  r.sl = r.atn > 0 ? r.slg / r.atn : null;
  r.ahtv = r.atn > 0 ? r.aht / r.atn : null;
  r.asa = r.asaN > 0 ? r.asaS / r.asaN : null;
  r.o2f = r.frc > 0 ? r.ofr / r.frc : null;
  r.h2f = r.frc > 0 ? r.atn / r.frc : null;
  const hasO = r.sched > 0 || r.req > 0 || r.frc > 0;
  r.schedv = hasO ? r.sched / n : null; r.reqv = hasO ? r.req / n : null;
  r.auxT = Object.keys(r.aux).reduce((a, k) => a + r.aux[k], 0);
  if (r.conn > 0) { r.pres = r.conn / 1800 / n; r.prod = (r.conn - r.auxT) / 1800 / n; r.avail = r.idle / r.conn; r.auxp = r.auxT / r.conn; }
  else { r.pres = null; r.prod = null; r.avail = null; r.auxp = null; }
  if (hasO && r.conn > 0 && r.sched > 0) { const a = (r.sched - r.conn / 1800) / r.sched; r.aus = onp ? Math.max(0, a) : a; } else r.aus = null;
  return r;
}
const qOf = (p, seg) => Object.keys(p.queueMap).filter((q) => p.queueMap[q] === seg);
const lobsOf = (p, seg) => Object.keys(p.lobMap).filter((l) => p.lobMap[l] === seg);

const segList = (p, sel) => (sel === "Todos" ? p.segments.map((s) => s.name).filter((n) => p.segVis[n] !== false) : [sel]);

function dayType(date, p) { const s = fdate(date); if (p.feriados.indexOf(s) >= 0) return "fer"; const w = date.getDay(); return (w === 0 || w === 6) ? "fin" : "lv"; }
function visIdx(d, p) {
  const hz = p.horario[dayType(d.date, p)] || { d: "", h: "" };
  const from = hz.d && !isNaN(toMin(hz.d)) ? toMin(hz.d) : 0, to = hz.h && !isNaN(toMin(hz.h)) ? toMin(hz.h) : 1440;
  const out = []; for (let i = 0; i <= d.closed && i < SLOTS.length; i++) { const m = SLOTS[i].m; if (m >= from && m < to) out.push(i); }
  return out;
}
function segRows(d, p, sel) {
  const onp = CAMPS[d.id].kind === "onp", names = segList(p, sel), idx = visIdx(d, p);
  const rows = idx.map((i) => {
    const r = blank();
    names.forEach((n) => {

      lobsOf(p, n).forEach((l) => { if (d.lobs[l]) addL(r, d.lobs[l][i]); });

function supAgg(ags) {

  return Object.keys(m).map((k) => { const s = m[k]; return { name: s.name, atn: s.atn, aht: s.atn ? s.a / s.atn : 0, hold: s.atn ? s.h / s.atn : 0, ring: s.atn ? s.r / s.atn : 0, tab: s.tab, bano: s.bano, brk: s.brk }; });
}
function motivosOf(d, p, sel) {
  const m = {};

  for (let i = 0; i < start; i++) g += "<div></div>";
  for (let d = 1; d <= days; d++) { const dt = new Date(cs.y, cs.m, d, 12), diff = Math.round((today - dt) / 864e5), dis = dt > today || diff > 31; g += '<button data-act="calpick" data-v="' + diff + '"' + (dis ? " disabled" : "") + (diff === S.dayOff ? ' class="on"' : "") + ">" + d + "</button>"; }
  return '<h3>Personalizar fecha</h3><div class="row"><button class="btn sm" data-act="calprev">◀</button><b style="flex:1;text-align:center">' + MES[cs.m] + " " + cs.y + '</b><button class="btn sm" data-act="calnext">▶</button></div><div class="cal">' + g + '</div><div class="note">No se admiten fechas futuras ni anteriores a 31 días. Esc cierra.</div><div class="row" style="justify-content:flex-end"><button class="btn" data-act="closeM">Cerrar</button></div>';
}
function mailHTML(c) {
  const m = c.p.mail, f = c.p.cfgMail || { to: "equipo@ejemplo.com", cc: "supervision@ejemplo.com", subj: "Reporte del día {fecha} {hora} — Campaña " + c.id };
  const now = new Date(), sub = f.subj.replace("{fecha}", pad(now.getDate()) + "/" + pad(now.getMonth() + 1)).replace("{hora}", pad(now.getHours()) + ":" + pad(now.getMinutes())).replace("{hhmm}", pad(now.getHours()) + pad(now.getMinutes()));
  const lab = { acum: "Acumulado", traf: "Gráfico de tráfico", niv: "Niveles x Franja", aux: "Detalle AUX", rsup: "Rankings Supervisores", rag: "Rankings Agentes", ingr: "Ingresos por franja por colas", tipo: "Tipologías" };
  const body = Object.keys(lab).filter((k) => m.body[k] && !(c.onp && k === "tipo")).map((k) => "<li>" + lab[k] + "</li>").join("") || "<li class='muted'>(sin secciones)</li>";
  const adj = [m.adj.acum ? "Reporte Acumulado (.xlsx)" : "", !c.onp && m.adj.tipif ? "Tipificaciones (.xlsx)" : ""].filter(Boolean).map((x) => "<li>" + x + "</li>").join("") || "<li class='muted'>(sin adjuntos)</li>";
  return '<h3>Borrador de correo (simulado)</h3><div class="frm" style="grid-template-columns:70px 1fr;gap:4px 10px"><b>Para</b><span>' + esc(f.to) + "</span><b>CC</b><span>" + esc(f.cc) + "</span><b>Asunto</b><span>" + esc(sub) + '</span></div><div class="sec">Cuerpo</div><ul>' + body + '</ul><div class="sec">Adjuntos</div><ul>' + adj + '</ul><div class="note">El programa real abre un borrador y nunca envía solo. Esta demo no abre ni envía ningún correo.</div><div class="row" style="justify-content:flex-end"><button class="btn" data-act="closeM">Cerrar</button></div>';
}


/* ===================== Cáscara: barra lateral, superior y estado ===================== */
const srcName = () => ({ red: "Red", local: "Local", demo: "Demo" }[S.mode]);
function renderSide() {
  const id = S.camp, C = CAMPS[id];
  const emb = $("#emb"); emb.style.background = "hsl(" + C.hue + ",65%,42%)"; emb.textContent = id;
  $("#camp").innerHTML = Object.keys(CAMPS).map((k) => '<option value="' + k + '"' + (k === id ? " selected" : "") + ">Campaña " + k + "</option>").join("");
  const pend = S.users.pend.length;
  $("#nav").innerHTML = NAVS.map((g) => '<div class="cap">' + g[0] + "</div>" + g[1].map((n) => '<div class="nav' + (S.view === n[0] ? " on" : "") + '" data-act="nav" data-v="' + n[0] + '" role="button" tabindex="0"><span class="ic">' + n[1] + "</span><span>" + n[2] + (n[0] === "usuarios" && pend ? " (" + pend + ")" : "") + "</span></div>").join("")).join("");
  $("#bupd").disabled = S.loading; $("#bmail").disabled = !S.data[id];
}
function renderTop() {
  $("#ver").textContent = VER;
  const M = { red: ["MODO RED", "red"], local: ["MODO LOCAL", "loc"], demo: ["MODO DEMO", "demo"] }[S.mode], b = $("#modebtn");
  b.textContent = M[0]; b.className = "mode " + M[1];
  $("#thbtn").textContent = S.theme === "dark" ? "Tema claro" : "Tema oscuro";
  $("#updst").textContent = S.updMsg;
}
const renderBar = () => { $("#bar").textContent = S.status || ("Campaña " + S.camp + ": presione Actualizar datos para cargarlos."); };
function logLine(type, msg) {
  const n = new Date(); S.logs.push({ t: pad(n.getHours()) + ":" + pad(n.getMinutes()) + ":" + pad(n.getSeconds()), type: type, msg: msg });
  if (S.logs.length > 200) S.logs.shift(); renderLog();
}
function renderLog() { const el = $("#log"); el.innerHTML = S.logs.map((l) => '<div><span class="t">' + l.t + '</span> <span class="' + l.type + '">' + esc(l.msg) + "</span></div>").join(""); el.scrollTop = el.scrollHeight; }
function render() {
  document.documentElement.setAttribute("data-theme", S.theme);
  renderSide(); renderTop();
  const v = $("#view"), top = v.scrollTop;
  const fn = { dashboard: viewDashboard, historial: viewHist, usuarios: viewUsers, parametros: viewParams, config: viewConfig, glosario: viewGloss, changelog: viewChangelog, acerca: viewAbout }[S.view];
  try { v.innerHTML = fn(); } catch (e) { v.innerHTML = '<div class="ph">Ocurrió un error inesperado (' + esc(e && e.name) + ") — ver el registro.</div>"; logLine("error", "Error al dibujar la vista: " + (e && e.message)); }
  v.scrollTop = top; renderBar();
}
let tt;
function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 2600); }

/* ===================== Actualizar datos (simulado) ===================== */
function actualizar() {
  if (S.loading) return;
  const id = S.camp, C = CAMPS[id], t0 = Date.now();
  S.loading = true; S.status = "Cargando datos — fuente: " + srcName() + "…"; render();
  const nq = Object.keys(C.segs).reduce((a, n) => a + C.segs[n].length, 0);
  [[0, "step", "Actualizando Campaña " + id + "…"], [250, "info", "Fuente: " + srcName() + " (datos ficticios generados en el navegador)"], [550, "step", C.kind === "onp" ? "Consultando la base de datos (solo lectura)…" : "Leyendo las descargas de la central…"], [900, "info", "Colas leídas: " + nq + " · segmentos: " + Object.keys(C.segs).length], [1200, "step", "Cruzando agentes con el Roster…"], [1500, S.users.pend.length ? "warning" : "success", S.users.pend.length ? S.users.pend.length + " usuario(s) de la descarga sin cruzar con el Roster" : "Todos los usuarios cruzaron con el Roster"], [1800, "step", "Calculando franjas de 30 minutos…"]].forEach((s) => setTimeout(() => logLine(s[1], s[2]), s[0]));
  setTimeout(() => {
    S.seed = S.fixedSeed != null ? S.fixedSeed : Math.floor(Math.random() * 100000);
    S.data[id] = genData(id, S.seed, C.kind === "onp" ? S.dayOff : 0);
    S.loading = false;
    const d = S.data[id], n = new Date();
    logLine("success", "Calculado en " + ((Date.now() - t0) / 1000).toFixed(1).replace(".", ",") + " s");
    logLine("success", "Historial guardado: día " + pad(d.date.getDate()) + "/" + pad(d.date.getMonth() + 1) + " — franjas " + SLOTS[0].l + " a " + SLOTS[d.closed].l);
    S.status = "Calculado — fuente: " + srcName() + " — " + pad(n.getHours()) + ":" + pad(n.getMinutes()) + ":" + pad(n.getSeconds());
    render();
  }, 2100);
}
function updateCheck() {
  S.updMsg = "Buscando…"; render();
  setTimeout(() => { S.updMsg = "Está en la última versión (" + VER + ") — no hay versiones publicadas"; render(); }, 900);
}

/* ===================== Edición de parámetros ===================== */
function setPath(obj, path, val) { let o = obj; for (let i = 0; i < path.length - 1; i++) { if (o[path[i]] == null || typeof o[path[i]] !== "object") o[path[i]] = {}; o = o[path[i]]; } o[path[path.length - 1]] = val; }
const selKeys = (m) => Object.keys(m).filter((k) => m[k]);
function reapply(map, origin, keys, target) { keys.forEach((k) => { map[k] = target; origin[k] = "Manual"; }); }
function resetKeys(map, origin, keys, def) { keys.forEach((k) => { map[k] = def[k] === undefined ? null : def[k]; origin[k] = "Por defecto"; }); }
function addSeg(c) {
  const p = c.p, name = ($("#newseg").value || "").trim();
  if (!name) return "Escriba el nombre del segmento.";
  if (name.length > 30) return "El nombre admite hasta 30 caracteres.";
  if (/[\\/:*?"<>|\[\]]/.test(name)) return 'El nombre no admite los caracteres \\ / : * ? " < > | [ ]';
  if (["todos", "general"].indexOf(name.toLowerCase()) >= 0) return "El nombre «" + name + "» está reservado.";
  if (p.segments.some((s) => s.name.toLowerCase() === name.toLowerCase())) return "Ya existe un segmento con ese nombre.";
  p.segments.push({ name: name, origen: "Creado" }); p.segVis[name] = true; p.imgNiv[name] = true; p.mail.segs[name] = true; p.mail.traf[name] = true;
  return "Segmento «" + name + "» agregado. Elija colas en la tabla de abajo y presione Aplicar para que cuenten en él.";
}
function delSeg(c) {
  const p = c.p, n = S.selSeg, s = p.segments.filter((x) => x.name === n && x.origen === "Creado")[0];
  if (!s) return "Elija un segmento creado para eliminarlo.";
  p.segments = p.segments.filter((x) => x.name !== n);
  [p.queueMap, p.lobMap, p.overXlsMap, p.overDbMap].forEach((m) => Object.keys(m).forEach((k) => { if (m[k] === n) m[k] = null; }));
  delete p.segVis[n]; delete p.imgNiv[n]; delete p.mail.segs[n]; delete p.mail.traf[n];
  if (S.seg === n) S.seg = "Todos"; S.selSeg = "";
  return "Segmento «" + n + "» eliminado.";
}
function saveHz(c) {
  const h = {}, bad = [];
  [["lv", "d"], ["lv", "h"], ["fin", "d"], ["fin", "h"], ["fer", "d"], ["fer", "h"]].forEach((x) => { h[x[0]] = h[x[0]] || {}; const v = ($("#hz_" + x[0] + "_" + x[1]).value || "").trim(); h[x[0]][x[1]] = v; if (v && isNaN(toMin(v))) bad.push(v); });
  if (bad.length) return "Hora inválida: use el formato HH:MM.";
  for (const k of ["lv", "fin", "fer"]) { if (h[k].d && h[k].h && toMin(h[k].d) >= toMin(h[k].h)) return "En «" + ({ lv: "Lunes a viernes", fin: "Sábado y domingo", fer: "Feriados" }[k]) + "», «Desde» debe ser menor que «Hasta»."; }
  c.p.horario = h; return "Horario guardado.";
}
function addFer(c) {
  const v = ($("#newfer").value || "").trim(), m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(v);
  if (!m) return "Escriba la fecha con el formato DD/MM/AAAA.";
  const dt = new Date(+m[3], +m[2] - 1, +m[1]); if (dt.getDate() !== +m[1] || dt.getMonth() !== +m[2] - 1) return "La fecha no existe.";
  if (c.p.feriados.indexOf(v) >= 0) return "Ese feriado ya está cargado.";
  c.p.feriados.push(v); return "Feriado agregado.";
}

/* ===================== Acciones ===================== */
function act(a, el) {
  const c = ctx(), p = c.p, v = el && el.dataset ? el.dataset.v : "", msgs = {
    copytxt: "Texto copiado al portapapeles (simulado en la demo).", copyimg: "Imagen copiada al portapapeles (simulado en la demo).",
    copyblk: "Imagen del bloque copiada al portapapeles (simulado en la demo).", xlsx: "Exportado (simulado): la demo no descarga archivos."
  };
  const params = (m) => { S.pmsg = m; saveP(); render(); };
  switch (a) {
    case "nav": S.view = v; S.pmsg = ""; render(); $("#view").scrollTop = 0; $("#side").classList.remove("open"); break;
    case "upd": actualizar(); break;
    case "mail": case "mailx": openModal(mailHTML(c)); break;
    case "burger": $("#side").classList.toggle("open"); break;
    case "theme": S.theme = S.theme === "dark" ? "light" : "dark"; render(); break;
    case "mode": if (S.mode === "demo") toast("El modo Demo solo se elige en Configuración → Fuente de datos."); else { S.mode = S.mode === "red" ? "local" : "red"; S.status = "Fuente cambiada a " + srcName() + ": presione Actualizar datos."; render(); } break;
    case "chk": updateCheck(); break;
    case "logclr": S.logs = []; renderLog(); break;
    case "logcp": try { if (navigator.clipboard) navigator.clipboard.writeText(S.logs.map((l) => l.t + " " + l.msg).join("\n")); } catch (e) { /* sin portapapeles */ } toast("Log copiado al portapapeles."); break;
    case "mv": { const list = S.order.filter((id) => !(c.onp && (id === "motivo" || id === "tipif"))), id = el.dataset.id, k = list.indexOf(id), o = list[k + (+el.dataset.d)]; if (o) { const i1 = S.order.indexOf(id), i2 = S.order.indexOf(o); S.order[i1] = o; S.order[i2] = id; render(); } break; }
    case "col": S.collapsed[el.dataset.id] = !S.collapsed[el.dataset.id]; render(); break;
    case "copytxt": case "copyimg": case "copyblk": case "xlsx": toast(msgs[a]); break;
    case "simul": toast(el.dataset.m); break;
    case "cal": { const d = dayDate(S.dayOff); S.cal = { y: d.getFullYear(), m: d.getMonth() }; openModal(calHTML()); break; }
    case "calprev": S.cal.m--; if (S.cal.m < 0) { S.cal.m = 11; S.cal.y--; } $("#mbox").innerHTML = calHTML(); break;
    case "calnext": S.cal.m++; if (S.cal.m > 11) { S.cal.m = 0; S.cal.y++; } $("#mbox").innerHTML = calHTML(); break;
    case "calpick": S.dayOff = +v; closeModal(); actualizar(); break;
    case "closeM": closeModal(); break;
    case "tab": S[el.dataset.s] = v; S.pmsg = ""; render(); break;
    case "selseg": S.selSeg = v; render(); break;
    case "selq": S.selQ[v] = !S.selQ[v]; render(); break;
    case "selL": S.selL[v] = !S.selL[v]; render(); break;
    case "selO": S.selO[v] = !S.selO[v]; render(); break;
    case "selfer": S.selFer = v; render(); break;
    case "selsk": S.selSk = v; render(); break;
    case "selhist": S.selHist = v; render(); break;
    case "addseg": params(addSeg(c)); break;
    case "delseg": params(delSeg(c)); break;
    case "applyq": { const k = selKeys(S.selQ); if (!k.length) { params("Elija al menos una cola de la tabla."); break; } const t = $("#cq").value; reapply(p.queueMap, p.queueOrigin, k, t === "__none__" ? null : t); S.selQ = {}; params("Se aplicó el cambio a " + k.length + " cola(s)."); break; }
    case "defq": { const k = selKeys(S.selQ), d = defParams(S.camp); resetKeys(p.queueMap, p.queueOrigin, k.length ? k : Object.keys(p.queueMap), d.queueMap); S.selQ = {}; params("Valores por defecto restaurados para las colas."); break; }
    case "applyL": { const k = selKeys(S.selL); if (!k.length) { params("Elija al menos un LOB de la tabla."); break; } const t = $("#cl").value; reapply(p.lobMap, p.lobOrigin, k, t === "__none__" ? null : t); S.selL = {}; params("Se aplicó el cambio a " + k.length + " LOB."); break; }
    case "defL": { const k = selKeys(S.selL), d = defParams(S.camp); resetKeys(p.lobMap, p.lobOrigin, k.length ? k : Object.keys(p.lobMap), d.lobMap); S.selL = {}; params("Valores por defecto restaurados para los LOB."); break; }
    case "applyO": { const k = selKeys(S.selO); if (!k.length) { params("Elija al menos un LOB del Over."); break; } const t = $("#co").value === "__none__" ? null : $("#co").value; k.forEach((x) => { const nm = x.slice(2); (x[0] === "x" ? p.overXlsMap : p.overDbMap)[nm] = t; p.overOrigin[nm] = "Manual"; }); S.selO = {}; params("Se aplicó el cambio a " + k.length + " LOB del Over."); break; }
    case "defO": { const d = defParams(S.camp); Object.keys(p.overXlsMap).forEach((l) => { p.overXlsMap[l] = d.overXlsMap[l]; p.overDbMap[l] = d.overDbMap[l]; p.overOrigin[l] = "Por defecto"; }); S.selO = {}; params("Valores por defecto restaurados para el Over."); break; }
    case "savehz": params(saveHz(c)); break;
    case "addfer": params(addFer(c)); break;
    case "delfer": p.feriados = p.feriados.filter((f) => f !== S.selFer); S.selFer = ""; params("Feriado quitado."); break;
    case "setsk": { const nm = ($("#skname").value || "").trim(); if (!S.selSk) { params("Elija un skill de la lista."); break; } if (!nm) { params("Escriba el nombre, o presione «Por defecto»."); break; } p.skills[S.selSk] = { nombre: nm, origen: "Manual" }; params("Nombre guardado."); break; }
    case "defsk": if (!S.selSk) { params("Elija un skill de la lista."); break; } p.skills[S.selSk] = { nombre: "Skill " + S.selSk.replace("Skill_", ""), origen: "Por defecto" }; params("Nombre por defecto restaurado."); break;
    case "restore": openModal('<h3>Restaurar valores por defecto</h3><p>¿Restaurar todos los parámetros de la Campaña ' + c.id + " a sus valores por defecto?</p>" + '<div class="row" style="justify-content:flex-end"><button class="btn" data-act="closeM">No</button><button class="btn act" data-act="restoreYes">Sí</button></div>'); break;
    case "restoreYes": P[S.camp] = defParams(S.camp); S.seg = "Todos"; S.selQ = {}; S.selL = {}; S.selO = {}; closeModal(); params("Valores por defecto restaurados."); break;
    case "cruz": { const x = S.users.pend.splice(+el.dataset.i, 1)[0]; S.users.res.unshift({ u: x.u, r: x.sug, id: "336" + pad(10 + S.users.res.length), c: "cruce manual", by: "demo.user", chk: false }); render(); toast("Cruce guardado."); break; }
    case "nopert": { const x = S.users.pend.splice(+el.dataset.i, 1)[0]; S.users.res.unshift({ u: x.u, r: "—", id: "", c: "no pertenece a la campaña — no productivo", by: "demo.user", chk: false }); render(); toast("Usuario marcado como no productivo."); break; }
    case "hconf": case "hconfall": { const keep = []; S.users.her.forEach((x) => { if (a === "hconfall" || x.chk) S.users.res.unshift({ u: x.u, r: x.r, id: x.id, c: "cruce manual", by: "demo.user", chk: false }); else keep.push(x); }); S.users.her = keep; render(); break; }
    case "hundo": { const keep = []; S.users.her.forEach((x) => { if (x.chk) S.users.pend.push({ u: x.u, sug: x.r }); else keep.push(x); }); S.users.her = keep; render(); break; }
    case "rundo": { const keep = []; S.users.res.forEach((x) => { if (x.chk) S.users.pend.push({ u: x.u, sug: x.r === "—" ? "Agente 07" : x.r }); else keep.push(x); }); S.users.res = keep; render(); break; }
    case "help": S.help = !S.help; render(); break;
    case "gl": S.gloss = v; render(); break;
  }
}
function onChange(e) {
  const t = e.target, c = ctx();
  if (t.dataset.pp) {
    const path = JSON.parse(t.dataset.pp), val = t.type === "checkbox" ? t.checked : t.value;
    if (path[0] === "aux" && !val && !Object.keys(c.p.aux).some((k) => k !== path[1] && c.p.aux[k])) { S.pmsg = "La tabla AUX necesita al menos una categoría."; render(); return; }
    if (path[0] === "segVis" && !val && !c.p.segments.some((s) => s.name !== path[1] && c.p.segVis[s.name] !== false)) { S.pmsg = "Debe quedar al menos un segmento visible."; render(); return; }
    setPath(P[S.camp], path, val); S.pmsg = "Cambio guardado."; saveP(); render(); return;
  }
  if (t.dataset.uchk) { const k = t.dataset.uchk.split(":"); S.users[k[0]][+k[1]].chk = t.checked; return; }
  if (t.id === "camp") { S.camp = t.value; S.seg = "Todos"; S.selQ = {}; S.selL = {}; S.selO = {}; S.selSeg = ""; S.status = "Campaña " + S.camp + ": presione Actualizar datos para cargarlos."; if (S.data[S.camp]) S.status = "Calculado — fuente: " + srcName(); render(); return; }
  switch (t.dataset.chg) {
    case "seg": S.seg = t.value; render(); break;
    case "topAg": S.topAg = t.value; render(); break;
    case "topMot": S.topMot = t.value; render(); break;
    case "exclF": c.p.exclF = t.value; saveP(); render(); break;
    case "day": S.dayOff = +t.value; actualizar(); break;
    case "mode": S.mode = t.value; S.status = "Fuente: " + srcName() + ". Presione Actualizar datos para recalcular."; render(); break;
  }
}

/* ===================== Arranque ===================== */
function initWordmark() { $("#wmw").textContent = "KPI"; $("#wms").textContent = "Reporte Operativo"; }
function tickWordmark() {}
function parseHash() {
  const q = new URLSearchParams(location.hash.replace(/^#/, ""));
  if (q.get("th")) S.theme = q.get("th") === "dark" ? "dark" : "light";
  if (q.get("c") && CAMPS[q.get("c")]) S.camp = q.get("c");
  if (q.get("v")) S.view = q.get("v");
  if (q.get("t")) { if (S.view === "parametros") S.ptab = q.get("t"); if (S.view === "config") S.ctab = q.get("t"); if (S.view === "usuarios") S.utab = q.get("t"); }
  if (q.get("seed") && isFinite(+q.get("seed"))) S.fixedSeed = +q.get("seed");
  if (q.get("seg")) S.seg = q.get("seg");
  if (q.get("gl")) S.gloss = q.get("gl");
}
function boot() {
  loadP(); initUsers(); parseHash(); initWordmark();
  document.addEventListener("click", (e) => { const el = e.target.closest("[data-act]"); if (el && !el.disabled) act(el.dataset.act, el); });
  document.addEventListener("dblclick", (e) => { if (e.target.closest("[data-dbl]")) toast("Abrir archivo (simulado: la demo no abre archivos)."); });
  document.addEventListener("change", onChange);
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeModal();
    if (e.key === "Enter") { const id = e.target && e.target.id; if (id === "newseg") act("addseg"); else if (id === "newfer") act("addfer"); else if (id === "skname") act("setsk", { dataset: {} }); }
    if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("nav")) { e.preventDefault(); act("nav", e.target); }
  });
  $("#modal").addEventListener("click", (e) => { if (e.target.id === "modal") closeModal(); });
  logLine("info", "Demo visual con datos ficticios.");
  logLine("info", "Todos los números se generan al azar en el navegador.");
  render(); tickWordmark();
  
  actualizar();
}
boot();
})();
